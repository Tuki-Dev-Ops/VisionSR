# Automated dependency updates.
#
# Grouped rather than one-PR-per-package: a repo with four ecosystems produces a
# stream nobody reviews, and an unreviewed update is worse than none. Security
# updates are deliberately left ungrouped so they arrive on their own and are
# obvious.

version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # torch is installed from the PyTorch index against a specific CUDA build, not
      # from PyPI (see the README install section). A Dependabot bump here would
      # propose a wheel the project does not use.
      - dependency-name: torch
      - dependency-name: torchvision

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned by tag and drift silently; a compromised or abandoned action
  # is a supply-chain problem in the thing that has write access to the repo.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
